#
# Raspberry Pi 5 bare-minimum Yocto local configuration
# Baseline boot profile for first-flash validation and serial/HDMI bring-up
#

# Target machine
MACHINE ??= "raspberrypi5"

# Base distro and packaging
DISTRO ?= "poky"
PACKAGE_CLASSES ?= "package_rpm"
EXTRA_IMAGE_FEATURES ?= "debug-tweaks ssh-server-openssh"
USER_CLASSES ?= "buildstats"
PATCHRESOLVE = "noop"

# Disk monitoring
BB_DISKMON_DIRS ??= "\
    STOPTASKS,${TMPDIR},1G,100K \
    STOPTASKS,${DL_DIR},1G,100K \
    STOPTASKS,${SSTATE_DIR},1G,100K \
    STOPTASKS,/tmp,100M,100K \
    HALT,${TMPDIR},100M,1K \
    HALT,${DL_DIR},100M,1K \
    HALT,${SSTATE_DIR},100M,1K \
    HALT,/tmp,10M,1K"

CONF_VERSION = "2"

# Build optimization and parallel job configuration
BB_NUMBER_THREADS ?= "4"
PARALLEL_MAKE ?= "-j 4"
PARALLEL_MAKE:pn-binutils-cross-arm = "-j 1"
PARALLEL_MAKE:pn-qemu-native = "-j 2"
SOURCE_DATE_EPOCH = "1640995200"

# ===================================================================
# RASPBERRY PI 5 BARE-MINIMUM BOOT CONFIGURATION
# Intentionally avoids the shared rpi4 init layer, Docker, static network
# profiles, and custom overlays so we can validate boot stability first.
# ===================================================================

MACHINE = "raspberrypi5"

# Keep the userspace simple and close to upstream defaults.
DISTRO_FEATURES:append = " systemd"
DISTRO_FEATURES:remove = "x11 wayland vulkan sysvinit"

VIRTUAL-RUNTIME_init_manager = "systemd"

IMAGE_INSTALL:append = " \
    openssh \
    openssh-sshd \
    openssh-keygen \
    kernel-modules \
    "

# Keep UART enabled for easier first-boot visibility if the BSP supports it.
ENABLE_UART = "1"

# Keep GPU memory low for a headless baseline image.
GPU_MEM = "64"

# Raspberry Pi 5 boots directly from firmware; do not insert U-Boot here.
RPI_USE_U_BOOT = "0"

# Build artifacts
IMAGE_FSTYPES = "tar.xz rpi-sdimg wic wic.bz2"
LICENSE_FLAGS_ACCEPTED = "commercial"
PACKAGE_EXCLUDE = "packagegroup-core-x11* packagegroup-xfce* mesa*"
INHERIT += "rm_work"

# Shared download and cache directories
DL_DIR ?= "${TOPDIR}/../downloads"
SSTATE_DIR ?= "${TOPDIR}/../sstate-cache"
TMPDIR = "${TOPDIR}/tmp"
