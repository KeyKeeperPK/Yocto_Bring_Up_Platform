#
# Raspberry Pi 5 Yocto local configuration
# Industrial/IoT profile aligned with the Raspberry Pi 4 template
#

# Target machine
MACHINE ??= "raspberrypi5"

# Base distro and packaging
DISTRO ?= "poky"
PACKAGE_CLASSES ?= "package_rpm"
EXTRA_IMAGE_FEATURES ?= "debug-tweaks ssh-server-openssh"
USER_CLASSES ?= "buildstats"
PATCHRESOLVE = "noop"

# Disk monitoring
BB_DISKMON_DIRS ??= "\
    STOPTASKS,${TMPDIR},1G,100K \
    STOPTASKS,${DL_DIR},1G,100K \
    STOPTASKS,${SSTATE_DIR},1G,100K \
    STOPTASKS,/tmp,100M,100K \
    HALT,${TMPDIR},100M,1K \
    HALT,${DL_DIR},100M,1K \
    HALT,${SSTATE_DIR},100M,1K \
    HALT,/tmp,10M,1K"

CONF_VERSION = "2"

# Build optimization and parallel job configuration
BB_NUMBER_THREADS ?= "4"
PARALLEL_MAKE ?= "-j 4"
PARALLEL_MAKE:pn-binutils-cross-arm = "-j 1"
PARALLEL_MAKE:pn-qemu-native = "-j 2"
SOURCE_DATE_EPOCH = "1640995200"

# ===================================================================
# RASPBERRY PI 5 INDUSTRIAL/IoT CONFIGURATION
# Features: SSH, WiFi, Docker, CAN, CAN-FD, UART, SPI, Ethernet, PCIe
# ===================================================================

MACHINE = "raspberrypi5"

# Distribution features for industrial applications
DISTRO_FEATURES:append = " systemd wifi bluetooth virtualization"
DISTRO_FEATURES:remove = "x11 wayland vulkan sysvinit"

# Use systemd as init manager
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"
VIRTUAL-RUNTIME_base-utils = "packagegroup-core-base-utils"
VIRTUAL-RUNTIME_network_manager = "networkmanager"

IMAGE_INSTALL:append = " coreutils util-linux iproute2 "

# ===================================================================
# DOCKER SUPPORT
# ===================================================================
DISTRO_FEATURES:append = " virtualization"
PREFERRED_PROVIDER_virtual/docker = "docker-ce"

IMAGE_INSTALL:append = " \
    docker-ce \
    runc-opencontainers \
    containerd-opencontainers \
    iptables \
    bridge-utils \
    "

KERNEL_FEATURES:append = " features/docker/docker.scc"

# ===================================================================
# NETWORKING - SSH, WiFi, Ethernet
# ===================================================================
IMAGE_INSTALL:append = " \
    openssh \
    openssh-sshd \
    openssh-keygen \
    linux-firmware-rpidistro-bcm43455 \
    wpa-supplicant \
    iw \
    hostapd \
    bluez5 \
    bluez5-obex \
    networkmanager \
    networkmanager-nmcli \
    dnsmasq \
    iperf3 \
    tcpdump \
    netcat \
    socat \
    curl \
    wget \
    ethtool \
    "

SYSTEM_AUTO_ENABLE:pn-systemd = " enable "
SYSTEM_AUTO_ENABLE:pn-networkmanager = " enable "

# ===================================================================
# CAN BUS SUPPORT WITH CAN-FD
# ===================================================================
RPI_EXTRA_CONFIG:append = "\n# mcp251xfd overlay \ndtparam=spi=on \ndtparam=watchdog=on \ndtoverlay=mcp251xfd,spi0-0,oscillator=40000000,interrupt=25 "

IMAGE_INSTALL:append = " \
    can-utils \
    libsocketcan \
    iproute2 \
    kernel-modules \
    kernel-module-can \
    kernel-module-can-raw \
    kernel-module-can-bcm \
    kernel-module-can-dev \
    kernel-module-mcp251x \
    kernel-module-mcp251xfd \
    "

KERNEL_MODULE_AUTOLOAD:append = " \
    can \
    can_raw \
    can_bcm \
    can_gw \
    can_dev \
    slcan \
    mcp251x \
    mcp251xfd \
    "

RPI_KERNEL_DEVICETREE_OVERLAYS:append = " \
    overlays/mcp251xfd.dtbo \
    "

# ===================================================================
# UART SUPPORT
# ===================================================================
ENABLE_UART = "1"
UART_CONSOLE = "serial0"

IMAGE_INSTALL:append = " \
    minicom \
    picocom \
    setserial \
    python3-pyserial \
    "

RPI_KERNEL_DEVICETREE_OVERLAYS:append = " \
    overlays/uart1.dtbo \
    overlays/uart2.dtbo \
    overlays/uart3.dtbo \
    overlays/uart4.dtbo \
    overlays/uart5.dtbo \
    "

# ===================================================================
# SPI SUPPORT
# ===================================================================
ENABLE_SPI = "1"

IMAGE_INSTALL:append = " \
    spitools \
    python3-spidev \
    "

RPI_KERNEL_DEVICETREE_OVERLAYS:append = " \
    overlays/spi0-0cs.dtbo \
    overlays/spi0-1cs.dtbo \
    overlays/spi0-2cs.dtbo \
    overlays/spi1-1cs.dtbo \
    overlays/spi1-2cs.dtbo \
    overlays/spi1-3cs.dtbo \
    overlays/spi2-1cs.dtbo \
    overlays/spi2-2cs.dtbo \
    overlays/spi2-3cs.dtbo \
    overlays/spi3-1cs.dtbo \
    overlays/spi3-2cs.dtbo \
    overlays/spi4-1cs.dtbo \
    overlays/spi4-2cs.dtbo \
    overlays/spi5-1cs.dtbo \
    overlays/spi5-2cs.dtbo \
    overlays/spi6-1cs.dtbo \
    overlays/spi6-2cs.dtbo \
    "

# ===================================================================
# GPIO AND I2C SUPPORT
# ===================================================================
ENABLE_I2C = "1"

IMAGE_INSTALL:append = " \
    i2c-tools \
    python3-smbus \
    libgpiod \
    libgpiod-tools \
    "

RPI_KERNEL_DEVICETREE_OVERLAYS:append = " \
    overlays/i2c0.dtbo \
    overlays/i2c1.dtbo \
    overlays/i2c3.dtbo \
    overlays/i2c4.dtbo \
    overlays/i2c5.dtbo \
    overlays/i2c6.dtbo \
    "

# ===================================================================
# DEVELOPMENT AND DEBUGGING TOOLS
# ===================================================================
IMAGE_INSTALL:append = " \
    htop \
    nano \
    vim \
    gdb \
    strace \
    ltrace \
    lsof \
    usbutils \
    pciutils \
    dmidecode \
    tree \
    rsync \
    screen \
    tmux \
    git \
    python3 \
    python3-modules \
    python3-pip \
    python3-setuptools \
    python3-can \
    python3-docker \
    "

# ===================================================================
# SYSTEM UTILITIES
# ===================================================================
IMAGE_INSTALL:append = " \
    chrony \
    logrotate \
    sudo \
    cronie \
    systemd-analyze \
    systemd-extra-utils \
    dbus \
    avahi-daemon \
    "

# ===================================================================
# CUSTOM INIT SCRIPTS
# ===================================================================
IMAGE_INSTALL:append = " \
    rpi4-init-scripts \
    netcfg \
    "

# ===================================================================
# HARDWARE CONFIGURATION
# ===================================================================
GPU_MEM = "64"

# Raspberry Pi 5 boots directly from firmware; meta-raspberrypi disables U-Boot.
RPI_USE_U_BOOT = "0"

# ===================================================================
# BUILD OPTIMIZATION
# ===================================================================
IMAGE_FSTYPES = "tar.xz rpi-sdimg wic wic.bz2"
LICENSE_FLAGS_ACCEPTED = "commercial"
PACKAGE_EXCLUDE = "packagegroup-core-x11* packagegroup-xfce* mesa*"
INHERIT += "rm_work"

# ===================================================================
# DIRECTORIES AND PATHS
# ===================================================================
DL_DIR ?= "${TOPDIR}/../downloads"
SSTATE_DIR ?= "${TOPDIR}/../sstate-cache"
TMPDIR = "${TOPDIR}/tmp"

# ===================================================================
# MACHINE FEATURES
# ===================================================================
MACHINE_FEATURES:append = " wifi bluetooth usbgadget usbhost pci"
